<!DOCTYPE html>
<html lang="cs">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Homework</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
        }

        #tasks {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        button {
            padding: 10px 16px;
            font-size: 14px;
            cursor: pointer;
            border: 1px solid #007acc;
            background-color: #f0f8ff;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #007acc;
            color: #ffffff;
        }

        #results {
            padding: 20px;
            border: 2px dashed #888888;
            border-radius: 6px;
            background-color: #fcfcfc;
            min-height: 40px;
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <h1>JavaScript is awesome!</h1>

    <div id="tasks"></div>

    <div id="results">Výsledky úloh se zobrazí zde...</div>

    <script src="assets/main.js"></script>
</body>

</html>
